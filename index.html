<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>freeCodeCamp survey form</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div class="formbox">
            <header>
                <h1 id="title">freeCodeCamp survey form</h1>
                <p id="subtitle"><i>thank you for taking the time to help us improve the platform</i></p>
            </header>
            <form action="#" method="post">
                <label for="name">Name</label>

                    <input type="text" id="name" placeholder="enter your name" name="username">
                <br/>
                <br/>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="enter your email" name="email"/>
                <br/>
                <br/>
<label for="age">Age(optional)</label>
    <input type="number" id="age" placeholder="enter your age" name="userAge"/>
<br/>
<br/>
<label for="dropdown" >Which option best describes your current role</label>
<select id="dropdown" name="role">
    <option value="student">student</option>
    <option value="teacher">teacher</option>
    <option value="parent">parent</option>
</select>
<br/>
<br/>
<fieldset>
<legend>Would you recommend freeCodeCamp to a friend.</legend>
<label>
<input type="radio" name="recommend" value="definitely" >definitely
</label>
<br/>
<label>
    <input type="radio" name="recommend" value="Maybe" >Maybe
</label>
<br/>
<label>
    <input type="radio" name="recommend" value="Not_sure" >Not sure
</label>
</fieldset>
<label for="favorite">What is your favorite feature of freeCodeCamp</label>
<select id="favorite" name="Favorite_feature">
    <option value="open-community">open community</option>
    <option value="challenges">Challenges</option>
    <option value="Competition">Competition</option>
    <option value="Project">Project</option>
    <option value="Interaction">Interaction</option>
</select>
<br/>
<br/>
<fieldset>
<legend>What would you like to see improved (check all that apply)</legend>

    <label>
        <input type="checkbox" name="improve" value="front-end" />Front-end projects
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="back-end"/>Back-end projects
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="data-visualization"/>Data visualization
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="challenges"/>challenges
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="open-source"/>Open Source Community
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="gitter_room" >Gitter help rooms
    </label>
    <br/>
    <label>
       <input type="checkbox" name="improve" value="videos">Videos
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="city-meetups">City Meetups
    </label>
    <br/>
    <label>
       <input type="checkbox" name="improve" value="wiki" >Wiki
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="forum" >Forum
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve" value="courses">Additional Courses
    </label>
</fieldset>
    <br/>
    <label>Any Comments or suggestion</label>
    <textarea placeholder="Enter your Comments here..." name="Comments"></textarea>
    <br/>
    <br/>
    <button>Submit</button>
            </form>
        </div>
    </body>
</html>
