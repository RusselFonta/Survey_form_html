<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>https://survey.form.freeCodeCamp.rocks</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div class="formbox">
            <header>
                <h1 id="title">freeCodeCamp survey form</h1>
                <p id="subtitle"><i>thanks you for taking time to help us improve the platform</i></p>
            </header>
            <form action="#" method="post">
                <label for="Name">Name</label>

                    <input type="text" id="Name" placeholder="enter your name" name="username">
                <br/>
                <br/>
                <label for="Email">Email</label>
                <input type="email" id="Email" placeholder="enter your email" name="email"/>
                <br/>
                <br/>
<label for="age">Age(optional)</label>
    <input type="number" id="age" placeholder="enter your age" name="userAge"/>
<br/>
<br/>
<label for="dropdown">Which option best describes your current role</label>
<select id="dropdown">
    <option value="student">student</option>
    <option value="teacher">teacher</option>
    <option value="parent">parent</option>
</select>
<br/>
<br/>
<fieldset>
<legend>Would you recommed freeCodeCamp to a friend.</legend>
<label>
    <br/>
<input type="radio" name="recommed">definitely
</label>
<br/>
<label>
    <input type="radio" name="recommed">Maybe
</label>
<br/>
<label>
    <input type="radio" name="recommed">Not sure
</label>
</fieldset>
<br/>
<br/>
<label for="favorite">What is your favorite feacture of freeCodeCamp</label>
<select id="favorite" name="Favorite">
    <option value="text">open community</option>
    <option value="text">Challengences</option>
    <option value="text">Competition</option>
    <option value="text">Project</option>
    <option value="">Interaction</option>
</select>
<br/>
<br/>
<fieldset>
<legend>What would you like to see improved (check all that apply)</legend>
<br/>
    <label>
        <input type="checkbox" name="improve"/>Font-end projects
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve"/>Back-end projects
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve"/>Data visualization
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve"/>challenges
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve"/>Open Source Community
    </label>
    <br/>
    <label>
        <input type="checkbox">Gitter help rooms
    </label>
    <br/>
    <label>
       <input type="checkbox" name="improve">Videos
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve">City Meetups
    </label>
    <br/>
    <label>
       <input type="checkbox" name="improve">Wiki
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve">Forum
    </label>
    <br/>
    <label>
        <input type="checkbox" name="improve">Additional Courses
    </label>
</fieldset>
    <br/>
    <br/>
    <label>Any Comments or suggestion</label>
    <textarea placeholder="Enter your Comments here..." name="Comments"></textarea>
    <br/>
    <br/>
    <button>Submit</button>
            </form>
        </div>
    </body>
</html>
